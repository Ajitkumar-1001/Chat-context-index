name: Release

# A tag remains a separately authorized publication action. Before creating it, the owner
# must configure protected tags, required release-environment reviewers and registry identities,
# and set RELEASE_APPROVED_SHA to the source commit accepted in the final evidence review.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  authorize:
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - name: Require explicit approval of this source commit
        env:
          APPROVED_SHA: ${{ vars.RELEASE_APPROVED_SHA }}
        run: test -n "$APPROVED_SHA" && test "$APPROVED_SHA" = "$GITHUB_SHA"

  publish-python:
    needs: [verify, authorize]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate
      - name: Verify and select CI-tested archives without rebuilding
        run: python scripts/release_controls.py artifacts --candidate candidate --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --tag "$GITHUB_REF_NAME" --output publish
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/python

  publish-typescript:
    needs: [verify, authorize]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ github.sha }}
          path: candidate
      - name: Verify and select CI-tested archives without rebuilding
        run: python scripts/release_controls.py artifacts --candidate candidate --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --tag "$GITHUB_REF_NAME" --output publish
      # Keep existing authentication until the registry-side OIDC identity is verified.
      - run: npm publish publish/npm/*.tgz --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
