name: CI

# PRD §13.4: formatting/linting, strict static checks, real-SQLite and real-Redis integration
# tests, concurrency/failure injection, shared cross-language conformance, and clean-install
# tests from built artifacts outside the source checkout. This workflow only builds and tests —
# it never publishes (see release.yml).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,redis]"
        working-directory: packages/python
      - run: ruff check src
        working-directory: packages/python
      - run: mypy src/cci --ignore-missing-imports
        working-directory: packages/python

  typescript-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: packages/typescript
      - run: npm run build
        working-directory: packages/typescript

  conformance-tests:
    runs-on: ubuntu-latest
    needs: [python-lint-and-typecheck, typescript-typecheck]
    # Real Redis (harness boundary: "A mock cannot prove Redis expiry, reconnection, or command
    # behavior") — the F8/F9/F10 failure-injection tests spin up their own disposable containers
    # via Docker directly (available on ubuntu-latest runners), not this service block; the
    # service block here is left absent intentionally to match how those tests already manage
    # their own container lifecycle (docker run/stop/start), which a fixed service container
    # would conflict with.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev,redis]"
        working-directory: packages/python
      - run: npm ci && npm run build
        working-directory: packages/typescript
      - name: Run conformance suite (real SQLite, real Redis via Docker, cross-language, failure injection)
        run: pytest ../../tests/conformance -v
        working-directory: packages/python

  clean-install:
    runs-on: ubuntu-latest
    needs: [conformance-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Python wheel
        run: |
          python -m pip install build
          python -m build --wheel
        working-directory: packages/python

      - name: Install wheel into a fresh venv outside the checkout
        run: |
          python -m venv /tmp/ci-wheel-venv
          /tmp/ci-wheel-venv/bin/pip install packages/python/dist/*.whl
          /tmp/ci-wheel-venv/bin/python -c "
          import sys
          import cci
          from cci.store import HistoryStore
          assert 'redis' not in sys.modules, 'importing cci must not load redis'
          print('Python wheel clean-install OK:', cci.__file__)
          "

      - name: Pack TypeScript tarball
        run: |
          npm ci
          npm run build
          npm pack
        working-directory: packages/typescript

      - name: Install tarball into a fresh consumer outside the checkout
        run: |
          mkdir -p /tmp/ci-ts-consumer
          cd /tmp/ci-ts-consumer
          npm init -y --scope=@ci-consumer >/dev/null 2>&1 || npm init -y >/dev/null 2>&1
          npm pkg set type=module >/dev/null
          npm install "${GITHUB_WORKSPACE}"/packages/typescript/chat-context-index-*.tgz
          node -e "
          import('chat-context-index').then(m => {
            console.log('TypeScript tarball clean-install OK:', Object.keys(m));
          });
          "
