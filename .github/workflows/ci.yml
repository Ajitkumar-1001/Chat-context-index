name: CI

# PRD §13.4: formatting/linting, strict static checks, real-SQLite and real-Redis integration
# tests, concurrency/failure injection, shared cross-language conformance, and clean-install
# tests from built artifacts outside the source checkout. This workflow only builds and tests —
# it never publishes (see release.yml).

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  python-lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,redis]"
        working-directory: packages/python
      - run: ruff check src
        working-directory: packages/python
      - run: mypy src/cci --ignore-missing-imports
        working-directory: packages/python

  typescript-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
        working-directory: packages/typescript
      - run: npm run build
        working-directory: packages/typescript

  conformance-tests:
    runs-on: ubuntu-latest
    needs: [python-lint-and-typecheck, typescript-typecheck]
    # Real Redis (harness boundary: "A mock cannot prove Redis expiry, reconnection, or command
    # behavior") — the F8/F9/F10 failure-injection tests spin up their own disposable containers
    # via Docker directly (available on ubuntu-latest runners), not this service block; the
    # service block here is left absent intentionally to match how those tests already manage
    # their own container lifecycle (docker run/stop/start), which a fixed service container
    # would conflict with.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev,redis]"
        working-directory: packages/python
      - run: npm ci && npm run build
        working-directory: packages/typescript
      - name: Run conformance, memory, examples, and evaluation accounting
        run: |
          pip install -r ../../evaluations/requirements-live.txt
          pytest ../../tests/conformance ../../tests/memory ../../tests/examples ../../tests/evaluations -v
        working-directory: packages/python
      - name: Run native TypeScript memory suite
        run: node --test tests/memory/*.test.mjs
      - name: Lint and typecheck the bounded release evaluator
        run: |
          python -m ruff check evaluations/held_out/release_validation.py tests/evaluations/test_release_validation.py --config packages/python/pyproject.toml
          python -m mypy evaluations/held_out/release_validation.py --ignore-missing-imports

  clean-install:
    name: Install Python ${{ matrix.python }} / Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [conformance-tests]
    strategy:
      fail-fast: false
      matrix:
        # GitHub's standard macos-15 image is arm64; verify the actual machine below.
        os: [ubuntu-24.04, macos-15]
        python: ["3.11", "3.12", "3.13", "3.14"]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Verify declared platform architecture
        run: |
          python -c 'import platform; expected = "arm64" if platform.system() == "Darwin" else "x86_64"; assert platform.machine() == expected, platform.machine()'

      - run: python -m pip install build
      - run: npm ci
        working-directory: packages/typescript
      - name: Verify fresh installed packages, restart recall, and cross-runtime memory
        run: python tests/packaging/verify_packages.py --report reports/package-memory.json
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.os }}-py${{ matrix.python }}-node${{ matrix.node }}
          path: reports/package-memory.json
          if-no-files-found: error
